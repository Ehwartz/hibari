[project]
name = "hibari"
version = "0.1.3"
description = "Hibari (雲雀): riichi mahjong trainer - play against AI, record and review games"
requires-python = ">=3.12,<3.13"
license = "AGPL-3.0-only"
dependencies = [
    "torch<2.9",
    "numpy>=1.24",
    "requests>=2.28",  # imported by mjbot_mortal/model.py
    "mahjong>=2.1.0",
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=8",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
